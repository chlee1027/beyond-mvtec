# 실험 범위. README의 「방법과 설정」 표와 같은 내용이다. 바꾸면 README도 같이 고친다.

seeds: [0, 1, 2]

preprocess:
  reproduce:          # 1단계 재현 (MVTec만), PatchCore 원 논문과 같음
    resize: 256
    center_crop: 224
  compare:            # 2~3단계 비교 (세 데이터셋 공통), 가장자리 결함이 잘리지 않게 자르지 않음
    resize: [256, 256]  # 두 변을 다 맞춘다. Resize(256)은 짧은 변만 맞춰 정사각이 아니면 긴 변이 잘린다
    center_crop: null
  common:
    grayscale_to_rgb: true        # MVTec Grid·Screw·Zipper
    mask_interpolation: nearest   # 원본 PatchCore 코드는 양선형 뒤 정수 변환이라 가장자리가 준다

datasets:
  mvtec_ad:
    categories: all   # 15 부류
  visa:
    categories: all   # 12 부류
    split: 1cls       # 공식 분할 CSV
  real_iad:
    # 30 부류 이름을 정렬해 random.Random(0).sample(이름, 10) 으로 뽑았다(experiment.draw_categories).
    # 결과를 보기 전에 정했다. 30 부류 전부는 Q1 계산 시간 때문에 쓰지 않는다
    categories: [bottle_cap, pcb, phone_battery, porcelain_doll, regulator, sim_card_set, switch,
                 usb, wooden_beads, woodstick]
    draw: {seed: 0, k: 10}
    views: [C1]       # 위(top) 시점. 00 노트북에서 audiojack 다섯 시점 사진으로 확인
    split: sv         # realiad_jsons_sv (단일 시점 분할). 부류마다 항목 수가 C1 사진 수와 같다
    label: image      # 표본 라벨이 아니라 이미지 라벨로 채점
    image_size: 256   # 비교 단계 전처리로 256 까지 줄인다. 받아 둔 zip 의 해상도와 상관없다
  mvtec_ad_2:         # Q1 넷째 데이터셋(2026-11-13 추가). 설정 10개 x 시드 3개를 그대로 돈다
    categories: all   # 8 부류(data.MVTEC2_CATEGORIES)
    split: test_public   # 정답이 공개된 시험셋. 조명 조건(regular 외 5~6가지)을 모두 함께 채점한다
    cache: [256, 256] # 원본을 비교 단계 크기로 한 번 줄여 Drive 에 둔다(data.cache_mvtec2). preprocess.compare 와 같아야 한다

methods:
  patchcore:
    backbones: [resnet18, wide_resnet50_2]
    layers: [[2, 3], [1, 2, 3]]
    coreset_ratio: [0.01, 0.10]
    # 계산 시간 때문에 Q1 에서 뺀다. 층 (1,2,3) 은 조각 격자가 layer1 이라 뱅크가 (2,3) 의 4 배이고
    # 코어셋 시간은 뱅크 크기의 제곱으로 는다. 재현 CSV 로 잡은 추정은 README 「Q1 설정」
    exclude:
      - {layers: [1, 2, 3], coreset_ratio: 0.10}
    neighborhood: 3   # 조각 특징을 3x3 이웃으로 평균
    upstream_commit: fcaa92f124fb1ad74a7acf56726decd4b27cbcad  # patchcore-inspection
  padim:
    backbones: [resnet18, wide_resnet50_2]
    layers: [[1, 2, 3], [2, 3]]
    reduced_dims: {resnet18: 100, wide_resnet50_2: 550}  # 원 논문은 (1,2,3)에서만 정함, (2,3)에 쓰는 것은 이 레포 선택
    cov_eps: 0.01     # 공분산 정규화 항, 원 논문 값 고정

reproduce:            # 1단계 재현 목표. 값은 README 「재현 목표」 표와 같다. 단위 %
  dataset: mvtec_ad
  preprocess: reproduce
  tolerance: {image_auroc: 0.5, pixel_auroc: 1.0, pro: 1.0}
  settings:
    - {method: patchcore, backbone: wide_resnet50_2, layers: [2, 3], coreset_ratio: 0.10,
       target: {image_auroc: 99.0, pixel_auroc: 98.1, pro: 93.5}}
    - {method: patchcore, backbone: wide_resnet50_2, layers: [2, 3], coreset_ratio: 0.01,
       target: {image_auroc: 99.0, pixel_auroc: 98.0, pro: 93.1}}
    - {method: padim, backbone: wide_resnet50_2, layers: [1, 2, 3],
       target: {image_auroc: 95.3, pixel_auroc: 97.5, pro: 92.1}}
    - {method: padim, backbone: resnet18, layers: [1, 2, 3],
       target: {pixel_auroc: 96.7, pro: 90.1}}   # ResNet18 이미지 AUROC 는 논문에 없다

few_shot:             # Q2. 방법마다 Q1 1위 설정을 데이터셋마다 모은 넷(2026-11-13)
  # (2026-11-08 계획) 방법마다 Q1에서 가장 좋은 설정 하나. -> Q1 에서 1위가 데이터셋마다 갈려서 둘씩 쓴다.
  # PatchCore: MVTec 1위 wrn50 (2,3) 10%, Real-IAD·VisA 1위 wrn50 (1,2,3) 1%.
  # PaDiM: MVTec·Real-IAD 1위 wrn50 (2,3), VisA 1위 wrn50 (1,2,3)(VisA 차이 0.19점, 시드 표준편차 0.52·0.61).
  settings: [patchcore_wrn50_L23_c10, patchcore_wrn50_L123_c1, padim_wrn50_L23_d550, padim_wrn50_L123_d550]
  n_train: [all, 50, 10]   # all 은 Q1 결과를 그대로 쓴다. 같은 시드의 10장은 50장 안에 든다(subsample_train)
